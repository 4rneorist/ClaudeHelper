# Builds the installers on Windows, macOS and Linux. node-pty is a native module, so each one is
# built on its own system. Pushing a v* tag also creates a draft GitHub release with the installers
# attached; running the workflow by hand only builds them (download from the run's Artifacts).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # electron-builder names the installers after package.json's version, so a tag that doesn't
      # match would publish e.g. claude-helper-0.1.0-setup.exe under v1.2.0.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Bump it with npm version."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      # No signing certificates yet, so don't let electron-builder look for one, and leave
      # publishing to the release job.
      - run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            installers/*.exe
            installers/*.dmg
            installers/*.AppImage
            installers/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ClaudeHelper $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
